[package]
name = "cps"
version = "0.1.0"
edition = "2024"
description = "Canopa Package System prototype"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
ring = "0.17"
rusqlite = "0.32"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
kdl = "6.5"
