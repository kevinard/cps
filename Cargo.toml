[package]
name = "cps"
version = "0.1.0"
edition = "2024"
description = "Canopa Package System prototype"
license = "MIT"

[profile.dev.package.sha2]
opt-level = 3

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
ring = "0.17"
rusqlite = "0.32"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
kdl = "6.5"
libc = "0.2"
libseccomp = "0.4"
object = { version = "0.37.3", default-features = false, features = ["elf", "read_core", "std", "unaligned"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
resolvo = "0.12"
tokio = { version = "1", features = ["rt"] }
tough = "0.24"
url = "2"
zstd = { version = "0.13.3", default-features = false }

[dev-dependencies]
jiff = "0.2"

[[example]]
name = "tuf-fixture"
path = "tests/support/tuf_fixture.rs"
