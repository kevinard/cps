name: Release rehearsal

on:
  workflow_dispatch:
    inputs:
      request:
        description: Rehearsal cases directory name
        type: string
        required: true
      candidate:
        description: Prepared candidate catalog SHA-256
        type: string
        required: true
      base:
        description: Current catalog SHA-256 when prepared (empty for a first release)
        type: string

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  rehearse:
    if: github.ref == 'refs/heads/main'
    needs: preflight
    runs-on: [self-hosted, linux, x64, cps-rehearsal]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the pinned rehearsal environment
        run: docker build --target boot -t "cps-rehearsal:$GITHUB_RUN_ID" ci
      - name: Rehearse the prepared catalog
        env:
          CPS_REHEARSAL_DATA: ${{ vars.CPS_REHEARSAL_DATA }}
          CPS_REHEARSAL_REPO: ${{ vars.CPS_REHEARSAL_REPO }}
          CPS_REHEARSAL_CASES: ${{ vars.CPS_REHEARSAL_CASES }}
          CPS_REHEARSAL_VM_GATE: ${{ vars.CPS_REHEARSAL_VM_GATE }}
          CPS_RELEASE_PUBLISHER: ${{ vars.CPS_RELEASE_PUBLISHER }}
          CPS_REQUEST: ${{ inputs.request }}
          CPS_CANDIDATE: ${{ inputs.candidate }}
          CPS_BASE: ${{ inputs.base }}
        run: |
          [[ "$CPS_REQUEST" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]]
          [[ "$CPS_REHEARSAL_DATA" = /* && "$CPS_REHEARSAL_CASES" = /* ]]
          data=$(realpath -e -- "$CPS_REHEARSAL_DATA")
          workspace=$(pwd -P)
          [[ -d "$data" && "$data" != / ]]
          for writable in "$workspace" "$(realpath -e -- "$RUNNER_TEMP")"; do
            [[ "$data/" != "$writable/"* && "$writable/" != "$data/"* ]]
          done
          for path in "$CPS_REHEARSAL_REPO" "$CPS_REHEARSAL_CASES" "$CPS_REHEARSAL_VM_GATE"; do
            [[ $(realpath -e -- "$path") == "$data/"* ]]
          done
          CPS_REHEARSAL_REPO=$(realpath -e -- "$CPS_REHEARSAL_REPO")
          CPS_REHEARSAL_CASES=$(realpath -e -- "$CPS_REHEARSAL_CASES")
          CPS_REHEARSAL_VM_GATE=$(realpath -e -- "$CPS_REHEARSAL_VM_GATE")
          mkdir -p "$RUNNER_TEMP/cps-cargo"
          run_ci() {
            docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env CARGO_HOME="$RUNNER_TEMP/cps-cargo" --volume "$workspace:$workspace" \
              --volume "$RUNNER_TEMP:$RUNNER_TEMP" --workdir "$workspace" "$@"
          }
          image="cps-rehearsal:$GITHUB_RUN_ID"
          run_ci "$image" cargo fetch --locked
          run_ci --network none --env CPS_REHEARSAL_REPO --env CPS_REHEARSAL_CASES --env CPS_REHEARSAL_VM_GATE \
            --env CPS_RELEASE_PUBLISHER --env CPS_REQUEST --env CPS_CANDIDATE --env CPS_BASE \
            --volume "$data:$data:ro" "$image" bash -euc '
              cargo build --frozen --release
              cargo test --frozen
              export CPS_BIN="$PWD/target/release/cps"
              bash tests/release-ci.sh
              bash ci/rehearse-release.sh "$CPS_REHEARSAL_CASES/$CPS_REQUEST" \
                  "$CPS_CANDIDATE" "$CPS_BASE" "$CPS_REHEARSAL_VM_GATE"
            '
      - name: Remove the local rehearsal image
        if: always()
        run: docker image rm "cps-rehearsal:$GITHUB_RUN_ID" || true
